<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Profile - VendorConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="brand">VendorConnect</a>
        <div class="navbar-nav">
            <a href="marketplace.html" class="btn btn-outline">Marketplace</a>
            <a href="cart.html" class="btn btn-outline">Cart</a>
            <a href="orders.html" class="btn btn-outline">My Orders</a>
            <a href="inquiries.html" class="btn btn-outline">My Inquiries</a>
            <a href="buyer-profile.html" class="btn btn-primary">My Profile</a>
            <a href="../authentication/login.html" class="btn btn-secondary" onclick="localStorage.clear()">Logout</a>
        </div>
    </nav>

    <div class="container-sm">
        <div id="setupBanner" class="mt-2" style="display: none; background: var(--nav-bg); border-left: 5px solid var(--primary); padding: 1.25rem; border-radius: var(--border-radius); box-shadow: var(--shadow);">
            <div style="display: flex; align-items: flex-start; gap: 0.75rem;">
                <div>
                    <h3 style="margin-bottom: 0.25rem; font-size: 1.1rem; color: var(--text-main);">Welcome to VendorConnect!</h3>
                    <p style="margin: 0; color: var(--text-muted); font-size: 0.95rem;">
                        Please complete your profile details and shipping address to personalize your craft shopping experience.
                    </p>
                </div>
            </div>
        </div>

        <div class="card mt-2">
            <h2 class="text-center text-primary" id="profileHeading">Buyer Profile</h2>
            <p class="text-center" id="profileSubheading">Manage your personal details and shipping address</p>
            
            <form onsubmit="updateProfile(event)" class="mt-2">
                <div class="form-group">
                    <label class="form-label" for="name">Full Name *</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email Address *</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number *</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="location">Shipping Address / Location</label>
                    <textarea id="location" class="form-control" rows="3" placeholder="Enter your default shipping address (house/flat no, street, city, pin code)"></textarea>
                </div>
                
                <div class="flex flex-between mt-2">
                    <a href="../index.html" id="cancelBtn" class="btn btn-outline">Cancel</a>
                    <button type="submit" id="saveProfileBtn" class="btn btn-primary">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="../js/api.js"></script>
    <script>
        let isSetupMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            if (!token || !userStr) {
                window.location.href = '../authentication/login.html';
                return;
            }

            const currentUser = JSON.parse(userStr);
            const urlParams = new URLSearchParams(window.location.search);
            isSetupMode = urlParams.get('setup') === 'true' || currentUser.isProfileComplete === false;

            if (isSetupMode) {
                document.getElementById('setupBanner').style.display = 'block';
                document.getElementById('profileHeading').innerText = 'Set Up Your Buyer Profile';
                document.getElementById('profileSubheading').innerText = 'Complete your profile details before exploring the marketplace';
                document.getElementById('saveProfileBtn').innerText = 'Complete Setup & Start Browsing';
                document.getElementById('cancelBtn').style.display = 'none';
            }

            loadProfile(currentUser);
        });

        async function loadProfile(currentUser) {
            try {
                const user = await apiRequest('/auth/profile', 'GET');
                document.getElementById('name').value = user.name || (currentUser && currentUser.name) || '';
                document.getElementById('email').value = user.email || (currentUser && currentUser.email) || '';
                document.getElementById('phone').value = user.phone || (currentUser && currentUser.phone) || '';
                document.getElementById('location').value = user.location || '';
            } catch (error) {
                console.error('Error loading profile:', error);
                if (currentUser) {
                    document.getElementById('name').value = currentUser.name || '';
                    document.getElementById('email').value = currentUser.email || '';
                    document.getElementById('phone').value = currentUser.phone || '';
                }
            }
        }

        async function updateProfile(event) {
            event.preventDefault();
            
            const saveBtn = document.getElementById('saveProfileBtn');
            const originalText = saveBtn.innerText;
            saveBtn.disabled = true;
            saveBtn.innerText = 'Saving...';

            const profileData = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                location: document.getElementById('location').value.trim()
            };

            try {
                const updatedUser = await apiRequest('/auth/profile', 'PUT', profileData);
                const currentUser = JSON.parse(localStorage.getItem('user')) || {};
                const mergedUser = { ...currentUser, ...updatedUser, isProfileComplete: true };
                localStorage.setItem('user', JSON.stringify(mergedUser));

                if (isSetupMode) {
                    alert('Profile setup completed! Welcome to VendorConnect.');
                    window.location.href = 'marketplace.html';
                } else {
                    alert('Profile updated successfully!');
                    saveBtn.disabled = false;
                    saveBtn.innerText = originalText;
                }
            } catch (error) {
                alert('Error updating profile: ' + error.message);
                saveBtn.disabled = false;
                saveBtn.innerText = originalText;
            }
        }
    </script>
</body>
</html>
