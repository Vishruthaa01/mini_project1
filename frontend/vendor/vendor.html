<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - VendorConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="brand">VendorConnect</a>
        <div class="navbar-nav">
            <a href="vendor.html" class="btn btn-outline">Dashboard</a>
            <a href="add-product.html" class="btn btn-primary">Add Products</a>
            <a href="orders.html" class="btn btn-outline">Orders</a>
            <a href="inquiries.html" class="btn btn-outline">Inquiries</a>
            <a href="vendor-profile.html" class="btn btn-outline">Profile</a>
            <a href="../authentication/login.html" class="btn btn-secondary" onclick="localStorage.clear()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="flex" class="flex-between align-center mb-2">
            <div>
                <h2 class="mb-05">Product Listing</h2>
                <p class="mb-0">Manage your product inventory and catalog</p>
            </div>
            <a href="add-product.html" class="btn btn-primary">+ Add Product</a>
        </div>

        <div id="emptyState" class="card text-center" class="p-4">
            <h3 class="text-primary">No products listed yet</h3>
            <p>Click "Add Products" to create your first product listing.</p>
            <a href="add-product.html" class="btn btn-primary mt-2">Add Products</a>
        </div>

        <div id="productGrid" class="grid" class="d-none">
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = requireAuth('vendor', true);
            if (!user) return;
            loadVendorProducts();
        });

        async function loadVendorProducts() {
            const emptyState = document.getElementById('emptyState');
            const productGrid = document.getElementById('productGrid');

            try {
                const storedProducts = await apiRequest('/products/vendor', 'GET');
                if (storedProducts.length === 0) {
                    emptyState.classList.remove('d-none');
                    productGrid.classList.add('d-none');
                    return;
                }

                emptyState.classList.add('d-none');
                productGrid.classList.remove('d-none');
                productGrid.innerHTML = '';

                storedProducts.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'card card-hover';
                    
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'w-100 mb-1 product-img-wrapper';
                    const img = document.createElement('img');
                    img.src = product.image || 'https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&w=600&q=80';
                    img.alt = product.name || 'Product Image';
                    img.className = 'w-100 product-img';
                    imgWrapper.appendChild(img);
                    card.appendChild(imgWrapper);

                    const content = document.createElement('div');

                    const badge = document.createElement('span');
                    badge.className = 'product-badge';
                    badge.textContent = product.category || 'Handicraft';
                    content.appendChild(badge);

                    const title = document.createElement('h3');
                    title.className = 'mb-05';
                    title.textContent = product.name || '';
                    content.appendChild(title);

                    const desc = document.createElement('p');
                    desc.className = 'text-sm mb-1';
                    const rawDesc = product.description || '';
                    desc.textContent = rawDesc.length > 80 ? rawDesc.substring(0, 80) + '...' : rawDesc;
                    content.appendChild(desc);

                    const footer = document.createElement('div');
                    footer.className = 'flex flex-between border-top';

                    const priceBlock = document.createElement('div');
                    const price = document.createElement('h3');
                    price.className = 'text-primary mb-0';
                    price.textContent = '₹' + (product.price || 0);
                    const stock = document.createElement('small');
                    stock.className = 'text-muted';
                    stock.textContent = 'Stock: ' + (product.stock !== undefined ? product.stock : 0) + ' units';
                    priceBlock.appendChild(price);
                    priceBlock.appendChild(stock);
                    footer.appendChild(priceBlock);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn btn-danger';
                    delBtn.textContent = 'Delete';
                    delBtn.addEventListener('click', () => deleteProduct(product._id));
                    footer.appendChild(delBtn);

                    content.appendChild(footer);
                    card.appendChild(content);

                    productGrid.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                alert('Error loading products');
            }
        }

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            try {
                await apiRequest('/products/' + productId, 'DELETE');
                loadVendorProducts();
            } catch (error) {
                alert('Error deleting product');
            }
        }
    </script>
</body>
</html>
