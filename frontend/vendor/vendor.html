<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vendor Dashboard - VendorConnect</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light border-bottom">
            <div class="container">
                <a class="navbar-brand fw-bold fs-4" href="../index.html">VendorConnect</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#vendorNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="vendorNavbar">
                    <div class="ms-auto d-flex align-items-center gap-2 mt-2 mt-lg-0">
                        <a href="add-product.html" class="btn btn-primary">Add Products</a>
                        <button class="btn btn-outline-primary" type="button">View Business</button>
                        <a href="vendor-profile.html" class="btn btn-outline-primary">Vendor Profile</a>
                        <a href="../authentication/login.html" class="btn btn-outline-danger">Logout</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container my-5">
            <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <div>
                    <h2 class="fw-bold mb-1">Product Listing</h2>
                    <p class="text-secondary mb-0">Manage your product inventory and catalog</p>
                </div>
                <a href="add-product.html" class="btn btn-primary">Add Products</a>
            </div>

            <!-- EMPTY STATE CARD -->
            <div id="emptyState" class="card p-5 text-center bg-white d-none">
                <div class="py-4">
                    <h4 class="fw-bold mb-2">No products listed yet</h4>
                    <p class="text-secondary mb-4">Click "Add Products" to create your first product listing.</p>
                    <a href="add-product.html" class="btn btn-primary btn-lg">Add Products</a>
                </div>
            </div>

            <!-- PRODUCT LIST GRID -->
            <div id="productGrid" class="row g-4">
                <!-- Dynamically populated via JS from localStorage -->
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', loadVendorProducts);

            function loadVendorProducts() {
                const storedProducts = JSON.parse(localStorage.getItem('vendor_products')) || [];
                const emptyState = document.getElementById('emptyState');
                const productGrid = document.getElementById('productGrid');

                if (storedProducts.length === 0) {
                    emptyState.classList.remove('d-none');
                    productGrid.innerHTML = '';
                    return;
                }

                emptyState.classList.add('d-none');
                productGrid.innerHTML = '';

                storedProducts.forEach(product => {
                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="card h-100">
                            <img src="${product.image}" class="card-img-top" alt="${product.name}" style="height: 200px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <div class="mb-2">
                                    <span class="badge bg-light text-dark border">${product.category}</span>
                                </div>
                                <h5 class="fw-bold mb-1">${product.name}</h5>
                                <p class="text-secondary small mb-3 flex-grow-1">${product.description}</p>
                                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                    <div>
                                        <span class="fw-bold fs-5">₹${product.price}</span>
                                        <small class="text-muted d-block">Stock: ${product.stock} units</small>
                                    </div>
                                    <button class="btn btn-outline-danger btn-sm" onclick="deleteProduct(${product.id})">Delete</button>
                                </div>
                            </div>
                        </div>
                    `;
                    productGrid.appendChild(col);
                });
            }

            function deleteProduct(productId) {
                let storedProducts = JSON.parse(localStorage.getItem('vendor_products')) || [];
                storedProducts = storedProducts.filter(p => p.id !== productId);
                localStorage.setItem('vendor_products', JSON.stringify(storedProducts));
                loadVendorProducts();
            }
        </script>
    </body>
</html>
