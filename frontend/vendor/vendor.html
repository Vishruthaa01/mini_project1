<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - VendorConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="brand">VendorConnect</a>
        <div class="navbar-nav">
            <a href="vendor.html" class="btn btn-outline">Dashboard</a>
            <a href="add-product.html" class="btn btn-primary">Add Products</a>
            <a href="vendor-profile.html" class="btn btn-outline">Profile</a>
            <a href="../authentication/login.html" class="btn btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="flex" class="flex-between align-center mb-2">
            <div>
                <h2 class="mb-05">Product Listing</h2>
                <p class="mb-0">Manage your product inventory and catalog</p>
            </div>
            <a href="add-product.html" class="btn btn-primary">+ Add Product</a>
        </div>

        <div id="emptyState" class="card text-center" class="p-4">
            <h3 class="text-primary">No products listed yet</h3>
            <p>Click "Add Products" to create your first product listing.</p>
            <a href="add-product.html" class="btn btn-primary mt-2">Add Products</a>
        </div>

        <div id="productGrid" class="grid" class="d-none">
            <!-- Dynamically populated via JS -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadVendorProducts);

        function loadVendorProducts() {
            const storedProducts = JSON.parse(localStorage.getItem('vendor_products')) || [];
            const emptyState = document.getElementById('emptyState');
            const productGrid = document.getElementById('productGrid');

            if (storedProducts.length === 0) {
                emptyState.classList.remove('d-none');
                productGrid.classList.add('d-none');
                return;
            }

            emptyState.classList.add('d-none');
            productGrid.classList.remove('d-none');
            productGrid.innerHTML = '';

            storedProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card card-hover';
                
                card.innerHTML = `
                    <div class="w-100 mb-1 product-img-wrapper">
                        <img src="${product.image}" alt="${product.name}" class="w-100 product-img">
                    </div>
                    <div>
                        <span class="product-badge">${product.category}</span>
                        <h3 class="mb-05">${product.name}</h3>
                        <p class="text-sm mb-1">${product.description}</p>
                        <div class="flex flex-between border-top">
                            <div>
                                <h3 class="text-primary mb-0">₹${product.price}</h3>
                                <small class="text-muted">Stock: ${product.stock} units</small>
                            </div>
                            <button class="btn btn-danger" onclick="deleteProduct('${product.id}')">Delete</button>
                        </div>
                    </div>
                `;
                
                productGrid.appendChild(card);
            });
        }

        function deleteProduct(productId) {
            let storedProducts = JSON.parse(localStorage.getItem('vendor_products')) || [];
            storedProducts = storedProducts.filter(p => p.id.toString() !== productId.toString());
            localStorage.setItem('vendor_products', JSON.stringify(storedProducts));
            loadVendorProducts();
        }
    </script>
</body>
</html>
