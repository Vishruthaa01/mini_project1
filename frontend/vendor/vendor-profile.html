<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vendor Profile - VendorConnect</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light border-bottom">
            <div class="container">
                <a class="navbar-brand fw-bold fs-4" href="../index.html">VendorConnect</a>
                <div class="ms-auto">
                    <a href="vendor.html" class="btn btn-outline-primary">Back to Dashboard</a>
                </div>
            </div>
        </nav>

        <div class="container my-5" style="max-width: 750px;">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <div>
                        <h3 class="fw-bold mb-1">Vendor Profile</h3>
                        <p class="text-secondary mb-0">Manage your business profile and artisan details</p>
                    </div>
                </div>

                <div id="profileSaveAlert" class="alert alert-success d-none" role="alert">
                    Profile details updated successfully!
                </div>

                <form id="vendorProfileForm" onsubmit="handleSaveProfile(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="vendorBusinessName" class="form-label fw-semibold">Vendor / Business Name *</label>
                            <input type="text" class="form-control" id="vendorBusinessName" placeholder="e.g. Rameshwar Handlooms" required>
                        </div>
                        <div class="col-md-6">
                            <label for="vendorCraftType" class="form-label fw-semibold">Primary Craft Category *</label>
                            <select class="form-select" id="vendorCraftType" required>
                                <option value="Textiles & Handloom">Textiles & Handloom</option>
                                <option value="Pottery & Clay Art">Pottery & Clay Art</option>
                                <option value="Woodcraft">Woodcraft</option>
                                <option value="Handmade Jewelry">Handmade Jewelry</option>
                                <option value="Bamboo & Cane">Bamboo & Cane</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="vendorOwnerName" class="form-label fw-semibold">Owner / Artisan Name *</label>
                            <input type="text" class="form-control" id="vendorOwnerName" placeholder="e.g. Rameshwar Kumar" required>
                        </div>
                        <div class="col-md-6">
                            <label for="vendorPhone" class="form-label fw-semibold">Phone Number *</label>
                            <input type="tel" class="form-control" id="vendorPhone" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="col-md-6">
                            <label for="vendorEmail" class="form-label fw-semibold">Email Address *</label>
                            <input type="email" class="form-control" id="vendorEmail" placeholder="vendor@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label for="vendorLocation" class="form-label fw-semibold">Location / District *</label>
                            <input type="text" class="form-control" id="vendorLocation" placeholder="e.g. Varanasi, Uttar Pradesh" required>
                        </div>
                        <div class="col-12">
                            <label for="vendorBio" class="form-label fw-semibold">About Business / Craft Heritage</label>
                            <textarea class="form-control" id="vendorBio" rows="4" placeholder="Describe your craft history, weaving techniques, or workshop story..."></textarea>
                        </div>
                        <div class="col-12 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg w-100">Save Profile</button>
                            <a href="vendor.html" class="btn btn-outline-primary btn-lg">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', loadVendorProfile);

            function loadVendorProfile() {
                const profile = JSON.parse(localStorage.getItem('vendor_profile')) || {
                    businessName: "Rameshwar Handlooms",
                    craftType: "Textiles & Handloom",
                    ownerName: "Rameshwar Kumar",
                    phone: "+91 98765 43210",
                    email: "rameshwar@example.com",
                    location: "Varanasi, Uttar Pradesh",
                    bio: "Master weaver with over 20 years of experience in producing authentic traditional silk and cotton handloom sarees."
                };

                document.getElementById('vendorBusinessName').value = profile.businessName;
                document.getElementById('vendorCraftType').value = profile.craftType;
                document.getElementById('vendorOwnerName').value = profile.ownerName;
                document.getElementById('vendorPhone').value = profile.phone;
                document.getElementById('vendorEmail').value = profile.email;
                document.getElementById('vendorLocation').value = profile.location;
                document.getElementById('vendorBio').value = profile.bio;
            }

            function handleSaveProfile(event) {
                event.preventDefault();

                const profile = {
                    businessName: document.getElementById('vendorBusinessName').value.trim(),
                    craftType: document.getElementById('vendorCraftType').value,
                    ownerName: document.getElementById('vendorOwnerName').value.trim(),
                    phone: document.getElementById('vendorPhone').value.trim(),
                    email: document.getElementById('vendorEmail').value.trim(),
                    location: document.getElementById('vendorLocation').value.trim(),
                    bio: document.getElementById('vendorBio').value.trim()
                };

                localStorage.setItem('vendor_profile', JSON.stringify(profile));

                const alertBox = document.getElementById('profileSaveAlert');
                alertBox.classList.remove('d-none');
                setTimeout(() => {
                    alertBox.classList.add('d-none');
                }, 3000);
            }
        </script>
    </body>
</html>
