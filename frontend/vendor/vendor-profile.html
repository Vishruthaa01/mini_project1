<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Profile - VendorConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="brand">VendorConnect</a>
        <div class="navbar-nav">
            <a href="vendor.html" class="btn btn-outline">Dashboard</a>
            <a href="add-product.html" class="btn btn-outline">Add Products</a>
            <a href="vendor-profile.html" class="btn btn-primary">Profile</a>
            <a href="../authentication/login.html" class="btn btn-secondary">Logout</a>
        </div>
    </nav>

    <div class="container-sm">
        <div class="card" class="mt-2">
            <h2 class="text-center" class="text-primary">Business Profile</h2>
            <p class="text-center">Manage your artisan details and store settings</p>
            
            <form onsubmit="event.preventDefault(); alert('Profile Updated Successfully!');" class="mt-2">
                <div class="form-group">
                    <label class="form-label">Business / Artisan Name</label>
                    <input type="text" class="form-control" value="Kala Crafts" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Primary Craft Category</label>
                    <select class="form-control">
                        <option>Textiles & Handloom</option>
                        <option selected>Pottery & Clay Art</option>
                        <option>Woodcraft</option>
                        <option>Jewelry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Contact Email</label>
                    <input type="email" class="form-control" value="contact@kalacrafts.in" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" value="+91 98765 43210" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Store Location / Village</label>
                    <input type="text" class="form-control" value="Pochampally, Telangana" required>
                </div>

                <div class="form-group">
                    <label class="form-label">About the Artisan / Business</label>
                    <textarea class="form-control" rows="4">We are a family of traditional weavers specializing in Ikat silk sarees for over three generations.</textarea>
                </div>
                
                <div class="flex" class="flex-between mt-2">
                    <a href="vendor.html" class="btn btn-outline">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
