<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - VendorConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="brand">VendorConnect</a>
        <div class="navbar-nav">
            <a href="login.html" class="btn btn-outline">Login</a>
            <a href="signup.html" class="btn btn-primary">Sign Up</a>
        </div>
    </nav>

    <div class="container-sm">
        <div class="card" class="mt-2">
            <h2 class="text-center" class="text-primary">Create an Account</h2>
            <p class="text-center">Join our community of artisans and buyers</p>
            
            <form onsubmit="event.preventDefault(); window.location.href='../vendor/vendor.html';" class="mt-2">
                <div class="form-group">
                    <label class="form-label">Register as</label>
                    <div class="radio-group">
                        <div class="radio-card">
                            <input type="radio" name="signupRole" id="regVendor" value="vendor" checked>
                            <label for="regVendor">Vendor / Artisan</label>
                        </div>
                        <div class="radio-card">
                            <input type="radio" name="signupRole" id="regBuyer" value="buyer">
                            <label for="regBuyer">Buyer</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="fullName">Full Name / Business Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter your name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+91 98765 43210" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" class="w-100 btn-lg">Create Account</button>
            </form>
            
            <div class="text-center mt-2">
                <p class="text-sm">Already have an account? <a href="login.html" class="font-bold">Login</a></p>
            </div>
        </div>
    </div>
</body>
</html>
