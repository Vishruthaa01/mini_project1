<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up - VendorConnect</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-primary fs-4" href="../index.html">VendorConnect</a>
            </div>
        </nav>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-6">
                    <div class="card border-0 shadow-sm p-4">
                        <h2 class="fw-bold text-primary mb-3 text-center">Create an Account</h2>
                        <p class="text-secondary text-center mb-4">Choose your role to get started with VendorConnect</p>
                        
                        <form>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Register as:</label>
                                <div class="d-flex gap-3">
                                    <div class="form-check flex-fill p-3 border rounded bg-white">
                                        <input class="form-check-input" type="radio" name="signupType" id="signTypeVendor" value="vendor" checked>
                                        <label class="form-check-label fw-bold text-dark" for="signTypeVendor">
                                            Vendor
                                        </label>
                                    </div>
                                    <div class="form-check flex-fill p-3 border rounded bg-white">
                                        <input class="form-check-input" type="radio" name="signupType" id="signTypeBuyer" value="buyer">
                                        <label class="form-check-label fw-bold text-dark" for="signTypeBuyer">
                                            Buyer
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Full Name / Business Name</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" placeholder="+91 98765 43210" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Create password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">Sign Up</button>
                        </form>
                        
                        <div class="text-center">
                            <small class="text-secondary">Already have an account? <a href="login.html" class="text-primary text-decoration-none fw-bold">Login</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
