<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VendorConnect</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="../index.html" class="brand">VendorConnect</a>
        <div class="navbar-nav">
            <a href="login.html" class="btn btn-outline">Login</a>
            <a href="signup.html" class="btn btn-primary">Sign Up</a>
        </div>
    </nav>

    <div class="container-sm">
        <div class="card" class="mt-2">
            <h2 class="text-center" class="text-primary">Login to VendorConnect</h2>
            <p class="text-center">Select your account type to proceed</p>
            
            <form onsubmit="event.preventDefault(); window.location.href='../vendor/vendor.html';" class="mt-2">
                <div class="form-group">
                    <label class="form-label">Account Type</label>
                    <div class="radio-group">
                        <div class="radio-card">
                            <input type="radio" name="loginRole" id="btnRoleVendor" value="vendor" checked>
                            <label for="btnRoleVendor">Vendor / Artisan</label>
                        </div>
                        <div class="radio-card">
                            <input type="radio" name="loginRole" id="btnRoleBuyer" value="buyer">
                            <label for="btnRoleBuyer">Buyer</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email or Phone</label>
                    <input type="text" class="form-control" id="loginEmail" placeholder="Enter your email or phone" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" class="w-100 btn-lg">Login</button>
            </form>
            
            <div class="text-center mt-2">
                <p class="text-sm">Don't have an account? <a href="signup.html" class="font-bold">Sign Up</a></p>
            </div>
        </div>
    </div>
</body>
</html>
