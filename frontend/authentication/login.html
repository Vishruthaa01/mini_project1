<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - VendorConnect</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-primary fs-4" href="../index.html">VendorConnect</a>
            </div>
        </nav>

        <div class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card border-0 shadow-sm p-4">
                        <h2 class="fw-bold text-primary mb-3 text-center">Login to VendorConnect</h2>
                        <p class="text-secondary text-center mb-4">Select your account type to proceed</p>
                        
                        <form onsubmit="event.preventDefault(); window.location.href='../vendor/vendor.html';">
                            <div class="mb-4">
                                <label class="form-label fw-semibold d-block text-center mb-2">Select Login Account Type:</label>
                                <div class="btn-group w-100" role="group" aria-label="Role selection">
                                    <input type="radio" class="btn-check" name="loginRole" id="btnRoleVendor" value="vendor" checked autocomplete="off">
                                    <label class="btn btn-outline-primary btn-lg py-2" for="btnRoleVendor">
                                        Vendor / Artisan
                                    </label>

                                    <input type="radio" class="btn-check" name="loginRole" id="btnRoleBuyer" value="buyer" autocomplete="off">
                                    <label class="btn btn-outline-primary btn-lg py-2" for="btnRoleBuyer">
                                        Buyer
                                    </label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="loginEmail" class="form-label fw-semibold">Email or Phone</label>
                                <input type="text" class="form-control" id="loginEmail" placeholder="Enter your email or phone" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">Login</button>
                        </form>
                        
                        <div class="text-center">
                            <small class="text-secondary">Don't have an account? <a href="signup.html" class="text-primary text-decoration-none fw-bold">Sign Up</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
